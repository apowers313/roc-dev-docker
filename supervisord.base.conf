[supervisord]
logfile=/var/log/supervisord/supervisord.log
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisord
nodaemon=true
nocleanup=true
user=root

[inet_http_server]
port=*:8001

# Required for supervisorctl to drive supervisord over the inet socket.
# Without it the web UI still renders, but supervisorctl reports "did not
# recognize the supervisor namespace commands". Lets you do, inside the
# container: supervisorctl -s http://localhost:8001 status|restart <svc>
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:vscode]
command=sudo -E -u apowers /usr/bin/code-server --auth password --bind-addr 0.0.0.0:8004 --cert=/home/apowers/ssl/atoms.crt --cert-key=/home/apowers/ssl/atoms.key
priority=10
startsecs=2
autostart=true
autorestart=unexpected
stdout_logfile=/var/log/supervisord/vscode.log
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/supervisord/vscode.error.log
stderr_logfile_maxbytes=0

[program:jupyter]
# Absolute path: ~/.local/bin is first on PATH and the bind-mounted home's
# ~/.local/bin/jupyter carries a `#!/usr/bin/python3` shebang whose packages
# live in python3.10 -- that launcher fails on 24.04 (python3 is 3.12 there).
# /usr/local/bin/jupyter is the image's own copy and works on 22.04 and 24.04.
command=sudo -E -u apowers /usr/local/bin/jupyter lab --ip=0.0.0.0 --port=8002
priority=20
startsecs=2
autostart=true
autorestart=unexpected
stdout_logfile=/var/log/supervisord/jupyter.log
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/supervisord/jupyter.error.log
stderr_logfile_maxbytes=0
environment=PATH="/home/apowers/.local/bin:%(ENV_PATH)s"

[program:marimo]
command=sudo -E -u apowers python3.13 /usr/local/bin/marimo edit --host=0.0.0.0 --port=8003 --token-password="%(ENV_PASSWORD)s"
priority=20
startsecs=2
autostart=true
autorestart=unexpected
stdout_logfile=/var/log/supervisord/marimo.log
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/supervisord/marimo.error.log
stderr_logfile_maxbytes=0
directory=/home/apowers/Projects/roc/experiments
environment=PATH="%(ENV_PATH)s:/home/apowers/.local/bin"

[program:indexserver]
command=python3 -m http.server 80
directory=/var/run/indexserver
priority=30
startsecs=2
autostart=true
autorestart=unexpected
stdout_logfile=/var/log/supervisord/indexserver.log
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/supervisord/indexserver.error.log
stderr_logfile_maxbytes=0

[program:sshd]
command=/usr/sbin/sshd -D -o ListenAddress=0.0.0.0
priority=5
startsecs=2
autostart=true
autorestart=unexpected
stdout_logfile=/var/log/supervisord/sshd.log
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/supervisord/sshd.error.log
stderr_logfile_maxbytes=0

