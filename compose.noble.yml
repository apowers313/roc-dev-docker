# Compose override that runs the Ubuntu 24.04 image, leaving compose.yml alone.
#
# Cut over:
#   docker compose -f compose.yml -f compose.noble.yml --env-file .env up -d dev-env
# Roll back:
#   the same command WITHOUT -f compose.noble.yml
#
# Note: no --build at cutover on purpose. `make start` passes --build, which
# would rebuild from ./Dockerfile and retag :latest. Cut over to the exact
# image that was tested, then rebuild deliberately later if you want.
services:
  dev-env:
    image: apowers313/roc-dev:3.0.0-noble
    build:
      context: .
      dockerfile: Dockerfile.noble
      tags:
        - "apowers313/roc-dev:3.0.0-noble"
        - "ghcr.io/apowers313/roc-dev:3.0.0-noble"
