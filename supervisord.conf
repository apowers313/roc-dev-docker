[include]
files=/usr/local/etc/supervisord.base.conf

[program:memgraph]
directory=/usr/lib/memgraph
#command=/bin/bash -c "runuser -u memgraph /usr/lib/memgraph/memgraph -- %(ENV_MEMGRAPH)s"
command=/bin/bash -c "runuser -u memgraph /usr/lib/memgraph/memgraph"
priority=100
startsecs=10
autostart=true
autorestart=unexpected
stdout_logfile=/var/log/supervisord/memgraph.log
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/supervisord/memgraph.error.log
stderr_logfile_maxbytes=0

[program:loaddata]
directory=/tmp
command=/tmp/loaddata.sh
priority=999
startsecs=20
autostart=true
autorestart=unexpected
stdout_logfile=/var/log/supervisord/memgraphdata.log
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/supervisord/memgraphdata.error.log
stderr_logfile_maxbytes=0

[program:lab]
directory=/lab
# The bundle entrypoint differs by Lab generation: memgraph-platform (2.x,
# used by the 24.04 image) ships dist-backend/server.js, while the standalone
# memgraph/lab image (3.x, used by the 26.04 image) ships dist-backend/index.js.
# Pick whichever is present so one config serves both images.
command=/bin/bash -c 'if [ -f dist-backend/index.js ]; then exec node dist-backend/index.js; else exec node dist-backend/server.js; fi'
priority=100
startsecs=2
autostart=true
autorestart=unexpected
stdout_logfile=/var/log/supervisord/memgraphlab.log
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/supervisord/memgraphlab.error.log
stderr_logfile_maxbytes=0
